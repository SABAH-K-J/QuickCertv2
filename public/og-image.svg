<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="QuickCert — Certificates at any scale">
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#E7EBE3"/>
      <path d="M0 12 L12 0" stroke="#7D8F84" stroke-opacity="0.12" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="rosette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12251D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12251D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#12251D" stroke-width="2"/>
  <rect x="46" y="46" width="1108" height="538" fill="none" stroke="#12251D" stroke-width="0.75"/>
  <circle cx="1080" cy="120" r="96" fill="url(#rosette)"/>
  <circle cx="1080" cy="120" r="54" fill="none" stroke="#C4432D" stroke-width="1.5"/>
  <circle cx="1080" cy="120" r="28" fill="none" stroke="#12251D" stroke-width="1"/>
  <text x="90" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#7D8F84">QUICKCERT</text>
  <text x="90" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#12251D">Certificates</text>
  <text x="90" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#12251D">at any scale.</text>
  <text x="90" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#12251D">Design a template. Fill placeholders from a spreadsheet.</text>
  <text x="90" y="455" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#12251D">Download one PNG per recipient. Free and open source.</text>
  <g transform="translate(90,510)">
    <rect width="260" height="44" fill="none" stroke="#C4432D" stroke-width="1.5"/>
    <text x="16" y="29" font-family="monospace" font-size="14" letter-spacing="2" fill="#C4432D">OPEN SOURCE · MIT</text>
  </g>
  <text x="90" y="590" font-family="monospace" font-size="12" letter-spacing="2" fill="#7D8F84">SYNTHETIC SPECIMEN · NO REAL RECIPIENT DATA</text>
</svg>